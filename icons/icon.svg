<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4A261A"/>
      <stop offset="70%" stop-color="#24110A"/>
      <stop offset="100%" stop-color="#160905"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="50%" stop-color="#E9A900"/>
      <stop offset="100%" stop-color="#B87B00"/>
    </linearGradient>
    <linearGradient id="biscuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD68A"/>
      <stop offset="50%" stop-color="#E8A944"/>
      <stop offset="100%" stop-color="#C27A1E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle / circle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="110" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Golden Ring -->
  <circle cx="256" cy="235" r="165" fill="none" stroke="url(#goldGrad)" stroke-width="5" opacity="0.8" stroke-dasharray="12 8"/>

  <!-- Biscuit Body -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="235" r="140" fill="url(#biscuitGrad)"/>
    <circle cx="256" cy="235" r="130" fill="none" stroke="#A86312" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>
    
    <!-- Chocolate Chips -->
    <ellipse cx="210" cy="190" rx="14" ry="12" fill="#3D1A10" transform="rotate(-15 210 190)"/>
    <ellipse cx="295" cy="180" rx="16" ry="13" fill="#3D1A10" transform="rotate(25 295 180)"/>
    <ellipse cx="260" cy="245" rx="18" ry="14" fill="#3D1A10" transform="rotate(10 260 245)"/>
    <ellipse cx="195" cy="265" rx="15" ry="12" fill="#3D1A10" transform="rotate(-20 195 265)"/>
    <ellipse cx="310" cy="260" rx="14" ry="11" fill="#3D1A10" transform="rotate(45 310 260)"/>
    <ellipse cx="250" cy="310" rx="12" ry="10" fill="#3D1A10" transform="rotate(5 250 310)"/>

    <!-- Highlighting shine -->
    <ellipse cx="230" cy="140" rx="45" ry="14" fill="#FFF2CE" opacity="0.45" transform="rotate(-25 230 140)"/>
  </g>

  <!-- Badge text / Banner -->
  <g filter="url(#shadow)">
    <rect x="76" y="390" width="360" height="74" rx="22" fill="url(#goldGrad)"/>
    <rect x="80" y="394" width="352" height="66" rx="18" fill="#24110A"/>
    <text x="256" y="438" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">TRAFIK SAVEURS</text>
  </g>
</svg>
